[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hummuse"
version = "0.1.0"
description = "HumMuse core scaffold and experiment logging foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "basic-pitch==0.4.0",
  "pydantic>=2.6,<3",
  "fastapi>=0.115,<1",
  "onnxruntime>=1.24,<2",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "noisereduce>=3,<4",
  "numpy>=1.26,<3",
  "pyloudnorm>=0.1,<1",
  "requests>=2.31,<3",
  "soundfile>=0.13,<1",
  "streamlit>=1.32,<2",
  "structlog>=24.4,<26",
  "librosa>=0.10,<1",
  "MIDIUtil>=1.2.1,<2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "shared*", "ml*", "ui*", "evaluation*"]
